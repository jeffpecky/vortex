name: Build macOS Native Addons

on:
  push:
    branches: [main, master]
    paths:
      - 'src/vendor/@ant/computer-use-swift/**'
      - 'src/vendor/modifiers-napi/**'
      - '.github/workflows/build-macos-addons.yml'
  pull_request:
    paths:
      - 'src/vendor/@ant/computer-use-swift/**'
      - 'src/vendor/modifiers-napi/**'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        addon:
          - name: computer-use-swift
            path: src/vendor/@ant/computer-use-swift
            node_name: computer_use
          - name: modifiers-napi
            path: src/vendor/modifiers-napi
            node_name: modifiers
        arch:
          - runner: macos-latest
            target: arm64
            swift_arch: arm64
          - runner: macos-13
            target: x64
            swift_arch: x86_64

    name: Build ${{ matrix.addon.name }} (${{ matrix.arch.target }}-darwin)
    runs-on: ${{ matrix.arch.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: ${{ matrix.addon.path }}
        run: bun install --ignore-scripts

      - name: Build with static linking
        working-directory: ${{ matrix.addon.path }}
        run: |
          chmod +x build.sh
          ./build.sh ${{ matrix.arch.swift_arch }}

      - name: Verify build output
        working-directory: ${{ matrix.addon.path }}
        run: |
          ls -lh build/${{ matrix.addon.node_name }}.node
          file build/${{ matrix.addon.node_name }}.node
          echo "Checking for dynamic library dependencies..."
          otool -L build/${{ matrix.addon.node_name }}.node || true

      - name: Create vendor directory structure and copy binary
        shell: bash
        run: |
          mkdir -p vendor/${{ matrix.addon.name }}/${{ matrix.arch.target }}-darwin
          cp ${{ matrix.addon.path }}/build/${{ matrix.addon.node_name }}.node vendor/${{ matrix.addon.name }}/${{ matrix.arch.target }}-darwin/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.addon.name }}-${{ matrix.arch.target }}-darwin
          path: vendor/${{ matrix.addon.name }}/${{ matrix.arch.target }}-darwin/${{ matrix.addon.node_name }}.node
          if-no-files-found: error

  test:
    needs: build
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: vendor-artifacts

      - name: Organize binaries
        shell: bash
        run: |
          mkdir -p vendor/computer-use-swift vendor/modifiers-napi
          
          # Organize computer-use-swift
          for dir in vendor-artifacts/computer-use-swift-*; do
            if [ -d "$dir" ]; then
              arch_platform=$(basename "$dir" | sed 's/computer-use-swift-//')
              mkdir -p "vendor/computer-use-swift/$arch_platform"
              cp "$dir/computer_use.node" "vendor/computer-use-swift/$arch_platform/"
            fi
          done
          
          # Organize modifiers-napi
          for dir in vendor-artifacts/modifiers-napi-*; do
            if [ -d "$dir" ]; then
              arch_platform=$(basename "$dir" | sed 's/modifiers-napi-//')
              mkdir -p "vendor/modifiers-napi/$arch_platform"
              cp "$dir/modifiers.node" "vendor/modifiers-napi/$arch_platform/"
            fi
          done
          
          # Show final structure
          echo "Final vendor structure:"
          find vendor -type f

      - name: Install dependencies
        run: bun install

      - name: Run computer-use-swift tests
        working-directory: src/vendor/@ant/computer-use-swift
        run: bun test || echo "Tests not yet implemented"

      - name: Run modifiers-napi tests
        working-directory: src/vendor/modifiers-napi
        run: bun test || echo "Tests not yet implemented"
