name: Build macOS Native Addons

on:
  push:
    branches: [main, master]
    paths:
      - 'src/vendor/@ant/computer-use-swift/**'
      - 'src/vendor/modifiers-napi/**'
      - '.github/workflows/build-macos-addons.yml'
  pull_request:
    paths:
      - 'src/vendor/@ant/computer-use-swift/**'
      - 'src/vendor/modifiers-napi/**'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        addon:
          - name: computer-use-swift
            path: src/vendor/@ant/computer-use-swift
            node_name: computer_use
          - name: modifiers-napi
            path: src/vendor/modifiers-napi
            node_name: modifiers
        arch:
          - runner: macos-latest
            target: arm64
            swift_arch: arm64
          - runner: macos-latest
            target: x64
            swift_arch: x86_64

    name: Build ${{ matrix.addon.name }} (${{ matrix.arch.target }}-darwin)
    runs-on: ${{ matrix.arch.runner }}

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: ${{ matrix.addon.path }}
        run: bun install --ignore-scripts

      - name: Build with static linking
        working-directory: ${{ matrix.addon.path }}
        run: |
          chmod +x build.sh
          ./build.sh ${{ matrix.arch.swift_arch }}

      - name: Verify build output
        working-directory: ${{ matrix.addon.path }}
        run: |
          ls -lh build/${{ matrix.addon.node_name }}.node
          file build/${{ matrix.addon.node_name }}.node
          echo "Checking for dynamic library dependencies..."
          otool -L build/${{ matrix.addon.node_name }}.node || true

      - name: Create vendor directory structure and copy binary
        shell: bash
        run: |
          mkdir -p vendor/${{ matrix.addon.name }}/${{ matrix.arch.target }}-darwin
          cp ${{ matrix.addon.path }}/build/${{ matrix.addon.node_name }}.node vendor/${{ matrix.addon.name }}/${{ matrix.arch.target }}-darwin/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.addon.name }}-${{ matrix.arch.target }}-darwin
          path: vendor/${{ matrix.addon.name }}/${{ matrix.arch.target }}-darwin/${{ matrix.addon.node_name }}.node
          if-no-files-found: error


